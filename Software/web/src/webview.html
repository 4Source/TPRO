<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preact Matrix Webview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .app-container {
            width: 95vw;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }


        .matrix-container {
            position: relative;
            width: 100%;
            background: #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(91, 1fr);
            column-gap: 1px;
            row-gap: 1px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .world-map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            z-index: 2;
            pointer-events: none;
            object-fit: fill;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            transition: opacity 0.2s ease;
        }

        .dot {
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 50%;
            border: 2px solid black;
            transition: background-color 0.1s ease;
        }
        .dot.active {
            background-color: white;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }
        .dot.inactive {
            background-color: black;
        }

        .slider-container {
            position: relative;
            display: flex;
            align-items: center;
            flex-grow: 1;
            height: 40px;
        }

        .slider-horizontal-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #4b5563;
            z-index: 1;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            z-index: 10;
            position: relative;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: -7px;
            border: 2px solid #1a1a1a;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { h, render } from 'https://esm.sh/preact';
        import { useState, useEffect } from 'https://esm.sh/preact/hooks';
        import htm from 'https://esm.sh/htm';

        const html = htm.bind(h);

        function App() {
            const COLS = 55;
            const ROWS = 91;
            const totalDots = COLS * ROWS;

            const [matrixState, setMatrixState] = useState(new Array(totalDots).fill(false));
            const [showMap, setShowMap] = useState(false);
            const [mapOpacity, setMapOpacity] = useState(0.5);

            const [timeValue, setTimeValue] = useState(632);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState("x1");
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);

            const formatTime = (minutes) => {
                const hrs = Math.floor(minutes / 60);
                const mins = minutes % 60;
                return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
            };

            const handleImageError = (e) => {
                e.target.style.display = 'none';
                console.warn('png nicht gefunden');
            };

            return html`
                <div class="app-container">
                    
                    <div class="flex items-center justify-between bg-gray-800 px-6 py-4 rounded-xl border border-gray-700 shadow-lg">
                        <div class="flex items-center gap-3">
                            <input 
                                type="checkbox" 
                                id="worldMap" 
                                checked=${showMap} 
                                onChange=${() => setShowMap(!showMap)}
                                class="w-6 h-6 cursor-pointer accent-blue-500"
                            />
                            <label for="worldMap" class="text-base font-semibold cursor-pointer select-none">
                                Show World Map Image
                            </label>
                        </div>

                        <div class="flex items-center gap-3 bg-gray-900 px-4 py-1.5 rounded-lg border border-gray-700">
                            <span class="text-xs text-gray-400 uppercase tracking-wider font-bold">Opacity</span>
                            <input 
                                type="range" 
                                min="0" 
                                max="1" 
                                step="0.01"
                                value=${mapOpacity} 
                                onInput=${(e) => setMapOpacity(parseFloat(e.target.value))}
                                class="w-32 h-1.5 accent-blue-500 cursor-pointer"
                                disabled=${!showMap}
                            />
                            <span class="text-xs font-mono w-8 text-right">${Math.round(mapOpacity * 100)}%</span>
                        </div>
                    </div>

                    <div class="matrix-container">
                        ${showMap && html`
                            <img 
                                src="worldmap.png" 
                                class="world-map-overlay" 
                                style="opacity: ${mapOpacity};"
                                onError=${handleImageError}
                            />
                        `}
                        <div class="matrix-grid">
                            ${matrixState.map((active, index) => html`
                                <div 
                                    key=${index} 
                                    class="dot ${active ? 'active' : 'inactive'}"
                                    title="LED ${index}"
                                ></div>
                            `)}
                        </div>
                    </div>

                    <div class="flex items-center gap-4 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg w-full">
                        
                        <div class="flex items-center gap-2 min-w-[160px]">
                            <input 
                                type="date" 
                                value=${selectedDate}
                                onChange=${(e) => setSelectedDate(e.target.value)}
                                class="bg-gray-700 text-white text-sm rounded-lg px-3 py-2 outline-none border border-gray-600 focus:border-blue-500 w-full"
                            />
                        </div>

                        <div class="flex flex-grow items-center gap-4 px-2">
                            <span class="text-lg font-mono text-blue-400 min-w-[55px] text-center">${formatTime(timeValue)}</span>
                            <div class="slider-container">
                                <div class="slider-horizontal-line"></div>
                                <input 
                                    type="range" 
                                    min="0" 
                                    max="1439" 
                                    value=${timeValue} 
                                    onInput=${(e) => setTimeValue(parseInt(e.target.value))}
                                />
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <div class="flex bg-gray-900 rounded-lg p-1 border border-gray-700">
                                <button 
                                    onClick=${() => setIsPlaying(true)}
                                    class="px-4 py-1.5 rounded-md text-xs font-bold transition-all ${isPlaying ? 'bg-slate-200 text-black shadow-inner' : 'text-gray-400 hover:text-white'}"
                                >
                                    START
                                </button>
                                <button 
                                    onClick=${() => setIsPlaying(false)}
                                    class="px-4 py-1.5 rounded-md text-xs font-bold transition-all ${!isPlaying ? 'bg-slate-200 text-black shadow-inner' : 'text-gray-400 hover:text-white'}"
                                >
                                    STOP
                                </button>
                            </div>

                            <select 
                                value=${speed} 
                                onChange=${(e) => setSpeed(e.target.value)}
                                class="bg-gray-700 text-white text-sm rounded-lg px-3 py-2 outline-none border border-gray-600 focus:border-blue-500 min-w-[80px]"
                            >
                                ${["x1", "x2", "x10", "x24", "x240", "x360", "x3600"].map(s => html`
                                    <option value=${s}>${s}</option>
                                `)}
                            </select>
                        </div>
                    </div>

                </div>
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
